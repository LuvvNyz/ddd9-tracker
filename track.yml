name: DDD9 Clan Activity Tracker

on:
  schedule:
    # Every 10 minutes. GitHub may delay this by a few minutes under load —
    # that's normal and fine for this use case.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tracker
        run: node track.js
        env:
          PS99_CLAN_NAME: DDD9

      - name: Commit updated tracking.json
        run: |
          git config user.name "ddd9-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tracking.json
          git diff --quiet --cached || git commit -m "chore: update clan activity tracking"
          git push
